name: Build and validate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cmake:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Unit tests and real-data smoke test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: R reference parity (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq r-base-core
          Rscript r_script.R build/image1.csv build/image2.csv build/smoke-results/weights.csv build/smoke-results/r_predictions.csv
          python3 tests/check_r_parity.py build/smoke-results/predictions.csv build/smoke-results/r_predictions.csv
      - name: Research dataset learning benchmark (Linux)
        if: runner.os == 'Linux'
        run: |
          ./build/DisparityNetwork --left build/image1.csv --right build/image2.csv --reference build/disparity.csv --epochs 1000 --seed 42 --output-dir build/research-results
          python3 tests/check_research_metrics.py build/research-results/predictions.csv build/disparity.csv build/research-results/training_metrics.csv
      - name: Build and validate live research website from CI outputs
        if: runner.os == 'Linux'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          python3 scripts/build_site_data.py --input-dir build --site-dir site --out build/site --run-url "$RUN_URL" --commit "$COMMIT_SHA" --epochs 1000 --seed 42
          node --check site/app.js
          python3 -m unittest discover -s tests -p 'test_site_*.py' -v
      - name: Upload reproducible experiment outputs (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: disparity-research-results
          path: build/research-results/
      - name: Upload generated site bundle (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: disparity-site-bundle
          path: build/site/
          include-hidden-files: true

  pages:
    name: Publish GitHub Pages from verified CI output
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: cmake
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Recover the site generated by the successful training job
        uses: actions/download-artifact@v4
        with:
          name: disparity-site-bundle
          path: _site
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy validated results
        id: deployment
        uses: actions/deploy-pages@v4
